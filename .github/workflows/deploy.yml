name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, bcmath, pdo_mysql

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload app files
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }}"
          DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:domains/kitelink.growdigitec.com"
          rsync -az --delete -e "$SSH" \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='vendor' --exclude='.env' --exclude='.env.*' \
            --exclude='storage' --exclude='public' --exclude='tests' \
            ./ $DEST/laravel/
          rsync -az -e "$SSH" \
            --exclude='index.php' --exclude='.htaccess' --exclude='storage' \
            public/ $DEST/public_html/

      - name: Post-deploy commands
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd ~/domains/kitelink.growdigitec.com/laravel &&
            composer install --no-dev --optimize-autoloader --no-interaction &&
            php artisan migrate --force &&
            php artisan optimize:clear
          '